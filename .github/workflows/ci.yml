# Written by MeiliV, with assistance from OpenAI Codex.
# Modified by camomille299, with assistance from Claude (Anthropic) via claude.ai.
# Modified by Viktor Jurczenko, with assistance from Claude (Anthropic) via Claude Code.


name: CI - Test Runner

# Run the workflow when commits are pushed on main or when a PR is modified. The end-to-end tests
# (package com.github.se.amber.e2e) are not run here: e2e.yml runs them, on request only.
on:
  push:
    branches:
      - main

  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

# A new push to a PR cancels its run still going: only the latest commit's results matter. On main
# nothing is cancelled while it runs, but a run still waiting is replaced by a newer one; that is
# fine, since each release overwrites the same latest-debug one.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI
    # Execute the CI on the course's runners
    runs-on: ubuntu-latest

    steps:
      # First step : Checkout the repository on the runner
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7
        with:
          submodules: recursive
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of Sonar analysis (if we use Sonar Later)


      # Kernel-based Virtual Machine (KVM) is an open source virtualization technology built into Linux. Enabling it allows the Android emulator to run faster.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad #v6
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Cache SonarQube packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # Caching is a very useful part of a CI, as a workflow is executed in a clean environment every time,
      # this means that one would need to re-download and re-process gradle files for every run. Which is very time consuming.
      #
      # To avoid that, we cache the the gradle folder to reuse it later.
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 #v6

      # Cache the Emulator, if the cache does not hit, create the emulator.
      # API 34 matches targetSdk. compileSdk 37 is only the compile platform.
      - name: AVD cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34

      - name: create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d #v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
        run: |
          if [ -n "$GOOGLE_SERVICES" ]; then
            echo "$GOOGLE_SERVICES" | base64 --decode > ./app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES secret is not set. google-services.json will not be created."
          fi

      - name: Grant execute permission for gradlew
        run: |
          chmod +x ./gradlew

      # Check formatting
      - name: KTFmt Check
        run: |
          ./gradlew ktfmtCheck

      # Decode the debug keystore from the GitHub secret
      - name: Decode debug keystore
        env:
          CI_DEBUG_KEYSTORE: ${{ secrets.CI_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$CI_DEBUG_KEYSTORE" ]; then
            echo "$CI_DEBUG_KEYSTORE" | base64 --decode > app/ci-debug.keystore
          else
            echo "::warning::CI_DEBUG_KEYSTORE is not set. Using the default debug signing key."
          fi

      # This step runs gradle commands to build the application
      - name: Assemble
        run: |
          # To run the CI with debug information, add --info
          ./gradlew assemble lint --parallel --build-cache

      # This step upload the APK as an artifact
      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # Node 22, as functions/package.json declares, for the Functions emulator and its tests.
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 #v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Firebase CLI
        run: npm install --global --ignore-scripts firebase-tools@15.30.1

      # The emulators' jars, which the Firebase CLI downloads on first use
      - name: Firebase emulators cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-15.30.1

      # The Functions emulator loads the functions from functions/node_modules.
      - name: Install Functions dependencies
        run: npm ci --prefix functions --ignore-scripts

      - name: Test Functions
        run: npm test --prefix functions

      # Run the connected tests on the emulator, except the end-to-end ones (e2e.yml runs
      # those). Some still use the Firebase emulators, on the fake demo-amber project, so they can't
      # reach the real one. requireFirebaseEmulators makes them fail, not skip, if the emulators are
      # unreachable.
      - name: Connected tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d #v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: firebase emulators:exec --project demo-amber --only auth,firestore,functions './gradlew connectedCheck --parallel --build-cache -Pandroid.testInstrumentationRunnerArguments.requireFirebaseEmulators=true -Pandroid.testInstrumentationRunnerArguments.notPackage=com.github.se.amber.e2e'

      # The reports and logcat of the connected tests, to see why one failed
      - name: Upload connected test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4
        with:
          name: connected-test-reports
          path: |
            app/build/reports/androidTests/connected
            app/build/outputs/androidTest-results/connected

      # Run unit tests once, with the Firestore emulator available for the rules tests.
      - name: Unit and rules tests
        run: |
          firebase emulators:exec --only firestore \
            './gradlew check --parallel --build-cache'

      - name: Generate Firestore rules coverage report
        run: node scripts/generate-firestore-rules-coverage.js

      # This step generates the coverage report which will be uploaded to sonar
      - name: Generate Coverage Report
        run: |
          ./gradlew jacocoTestReport

      # Upload the various reports to sonar
      - name: Upload report to SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar --parallel --build-cache

  release:
    name: Release
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Download the APK from the artifacts
      - name: Download APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: app-debug

      # This step publish the APK into the releases. For now we use the APK debug.
      - name: publish the APK into the releases
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 #v2.6.2
        with:
          tag_name: latest-debug
          name: Latest debug build
          body: "Built from ${{ github.sha }}"
          prerelease: true
          files: app-debug.apk